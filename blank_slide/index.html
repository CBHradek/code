<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeShow Blank Slide Auto-Patcher v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #5825f5; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #5825f5; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #4018c0; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* Progress Bar Styles */
        .progress-container { margin-top: 20px; display: none; }
        .progress-bar-bg { width: 100%; background-color: #e9ecef; border-radius: 5px; overflow: hidden; height: 20px; margin-bottom: 10px; }
        .progress-bar-fill { height: 100%; background-color: #5825f5; width: 0%; transition: width 0.1s; }
        .stats { font-size: 14px; margin-top: 10px; color: #555; }
        #statusMessage { font-weight: bold; margin-top: 15px; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>FreeShow Auto-Patcher v2</h2>
    <p>Select your .show files. The tool will skip files that already start with a Blank slide, patch the rest, and package everything into a single ZIP.</p>
    
    <input type="file" id="fileInput" multiple accept=".show">
    <br>
    <button id="processBtn">Process Files & Download ZIP</button>
    
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="stats">
            <span id="progressText">0 / 0 files processed</span><br>
            <span id="patchedText" style="color: #28a745;">0 newly patched</span> | 
            <span id="skippedText" style="color: #17a2b8;">0 skipped (already had blank)</span>
        </div>
        <div id="statusMessage"></div>
    </div>
</div>

<script>
    function generateFreeShowId() {
        return Math.random().toString(16).substring(2, 13).padEnd(11, '0');
    }

    // Helper to allow the browser to update the UI during heavy loops
    const yieldToBrowser = () => new Promise(resolve => setTimeout(resolve, 0));

    document.getElementById('processBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('fileInput');
        const files = fileInput.files;

        if (files.length === 0) {
            alert("Please select at least one .show file first.");
            return;
        }

        // UI Setup
        const btn = document.getElementById('processBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const patchedText = document.getElementById('patchedText');
        const skippedText = document.getElementById('skippedText');
        const statusMessage = document.getElementById('statusMessage');

        btn.disabled = true;
        progressContainer.style.display = 'block';
        statusMessage.innerText = "Analyzing and patching files...";
        statusMessage.style.color = "#333";

        const zip = new JSZip();
        let newlyPatchedCount = 0;
        let skippedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const text = await file.text();
            
            try {
                let parsedData = JSON.parse(text);
                let showData = parsedData[1]; 

                // Find the active layout
                let activeLayoutId = showData.settings?.activeLayout;
                if (!activeLayoutId && showData.layouts) {
                    activeLayoutId = Object.keys(showData.layouts)[0];
                }

                // Check if the first slide is ALREADY a blank slide
                let isAlreadyPatched = false;
                if (activeLayoutId && showData.layouts[activeLayoutId] && showData.layouts[activeLayoutId].slides.length > 0) {
                    const firstSlideId = showData.layouts[activeLayoutId].slides[0].id;
                    const firstSlideData = showData.slides[firstSlideId];
                    
                    if (firstSlideData && firstSlideData.group === "Blank") {
                        isAlreadyPatched = true;
                    }
                }

                if (isAlreadyPatched) {
                    skippedCount++;
                    // Add the unmodified file to the zip so it's not lost
                    zip.file(file.name, text);
                } else {
                    // It needs patching!
                    let newSlideId = generateFreeShowId();
                    let newItemId = generateFreeShowId();
                    let newGlobalGroupId = generateFreeShowId();

                    const blankSlide = {
                        "group": "Blank",
                        "color": "#ff3856",
                        "settings": { "template": "" },
                        "notes": "",
                        "items": [
                            {
                                "type": "text",
                                "lines": [ { "align": "", "text": [ { "style": "font-size: 100px;", "value": "" } ] } ],
                                "style": "top:88px;left:50px;height:904px;width:1820px;",
                                "align": "",
                                "auto": false,
                                "id": newItemId
                            }
                        ],
                        "globalGroup": newGlobalGroupId,
                        "children": []
                    };

                    if (!showData.slides) showData.slides = {};
                    showData.slides[newSlideId] = blankSlide;

                    if (activeLayoutId && showData.layouts[activeLayoutId]) {
                        showData.layouts[activeLayoutId].slides.unshift({ "id": newSlideId });
                    }

                    parsedData[1] = showData;
                    zip.file(file.name, JSON.stringify(parsedData));
                    newlyPatchedCount++;
                }

            } catch (err) {
                console.error(`Error processing ${file.name}:`, err);
                // If it fails to parse, just add the original file so it isn't lost
                zip.file(file.name, text); 
            }

            // Update Progress Bar UI every 10 files (keeps it fast but visually smooth)
            if (i % 10 === 0 || i === files.length - 1) {
                let percent = Math.round(((i + 1) / files.length) * 100);
                progressBarFill.style.width = percent + '%';
                progressText.innerText = `${i + 1} / ${files.length} files processed`;
                patchedText.innerText = `${newlyPatchedCount} newly patched`;
                skippedText.innerText = `${skippedCount} skipped (already had blank)`;
                await yieldToBrowser();
            }
        }

        // Generate the ZIP file with its own progress tracker
        statusMessage.innerText = "Zipping files together... (this might take a minute for 4500 files)";
        progressBarFill.style.backgroundColor = "#ffc107"; // Change to yellow for zipping phase
        progressBarFill.style.width = "0%";

        zip.generateAsync({ type: "blob" }, function updateCallback(metadata) {
            progressBarFill.style.width = metadata.percent.toFixed(2) + " %";
        }).then(function(content) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "Patched_FreeShow_Songs.zip";
            link.click();
            
            statusMessage.innerText = "Done! Your ZIP file has been downloaded.";
            statusMessage.style.color = "#28a745";
            progressBarFill.style.backgroundColor = "#28a745"; // Change to green for done
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
